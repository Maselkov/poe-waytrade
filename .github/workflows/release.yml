name: Release

# Push a version tag to release that commit:  git tag v22.0.0 && git push origin v22.0.0
# The tag is the version: the PKGBUILD's pkgver is set from it for the build,
# so no version bump is committed first.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4

      # Before arch-setup.sh, which hands the checkout to the build user.
      - name: Version from the tag
        run: |
          version=${GITHUB_REF_NAME#v}
          # pacman's pkgver can't have "-", so no "v1.0.0-rc1".
          if ! printf '%s\n' "$version" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "Tag $GITHUB_REF_NAME isn't a version tag like v22.0.0" >&2
            exit 1
          fi
          sed -i -e "s/^pkgver=.*/pkgver=$version/" -e 's/^pkgrel=.*/pkgrel=1/' packaging/arch/PKGBUILD
          grep -E '^pkg(ver|rel)=' packaging/arch/PKGBUILD
          echo "VERSION=$version" >> "$GITHUB_ENV"
          # The checkout has no .git (git isn't installed yet), so give the
          # binaries the version too. daemon/Cargo.toml is left alone: its
          # version is only the fallback without git, and changing it would
          # need Cargo.lock updated for --locked.
          echo "WAYTRADE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: .github/scripts/arch-setup.sh

      - name: Test
        working-directory: daemon
        run: cargo test --locked

      - name: Arch package
        working-directory: packaging/arch
        run: su builder -c 'makepkg --noconfirm'
      - name: Layer exports only Vulkan entry points
        run: .github/scripts/check-exports.sh packaging/arch/pkg/poe-waytrade/usr/lib/libVkLayer_poe_waytrade.so

      # The same files as the Arch package, as a tarball laid out from / for
      # other distros (built on Arch: needs a recent glibc).
      - name: Tarball
        run: |
          name=poe-waytrade-$VERSION-x86_64
          mkdir -p dist
          tar -C packaging/arch/pkg/poe-waytrade --exclude='.*' -czf "dist/$name.tar.gz" usr
          cp packaging/arch/*.pkg.tar.zst dist/
          cd dist && sha256sum * > SHA256SUMS

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<NOTES
          ## Install

          **Arch Linux:** \`sudo pacman -U poe-waytrade-$VERSION-*.pkg.tar.zst\`

          **Other distros (recent glibc):** \`sudo tar -C / -xzf poe-waytrade-$VERSION-x86_64.tar.gz\`

          Set Path of Exile's Steam launch options to \`waytrade %command%\`. It turns the overlay on and runs the
          price daemon while you play (or uses the systemd socket's, if you enable it:
          \`systemctl --user enable --now poe-waytrade-daemon.socket\`).
          Trade searches need Chromium (or Google Chrome).
          NOTES
          # --repo: the checkout has no .git (git isn't installed when it runs),
          # so gh can't find the repository on its own.
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "Waytrade $VERSION" --notes-file notes.md --generate-notes

  # Updates the AUR package (aur.archlinux.org/packages/poe-waytrade) to the
  # release, from packaging/aur: builds it first, so a PKGBUILD that doesn't
  # build from the tag is never pushed. Needs two repository secrets:
  #   AUR_SSH_KEY   a private key whose public half is on the AUR account
  #   AUR_HOST_KEY  `ssh-keyscan -t ed25519 aur.archlinux.org`, checked
  # Without them (forks), it's skipped.
  aur:
    needs: release
    runs-on: ubuntu-latest
    container: archlinux:latest
    env:
      AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
      AUR_HOST_KEY: ${{ secrets.AUR_HOST_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        if: env.AUR_SSH_KEY != ''
        run: |
          .github/scripts/arch-setup.sh
          pacman -S --noconfirm --needed openssh

      # Named explicitly to ssh: it looks for ~/.ssh in root's passwd entry,
      # not the container's $HOME.
      - name: SSH to the AUR
        if: env.AUR_SSH_KEY != ''
        run: |
          install -d -m 700 /root/.aur-ssh
          printf '%s\n' "$AUR_SSH_KEY" > /root/.aur-ssh/key
          chmod 600 /root/.aur-ssh/key
          printf '%s\n' "$AUR_HOST_KEY" > /root/.aur-ssh/known_hosts
          echo "GIT_SSH_COMMAND=ssh -F none -i /root/.aur-ssh/key -o IdentitiesOnly=yes -o UserKnownHostsFile=/root/.aur-ssh/known_hosts -o StrictHostKeyChecking=yes" >> "$GITHUB_ENV"

      - name: Update the PKGBUILD
        if: env.AUR_SSH_KEY != ''
        run: |
          git clone ssh://aur@aur.archlinux.org/poe-waytrade.git aur
          chown -R builder aur
          # makepkg (for .SRCINFO) refuses to run as root.
          su builder -c ".github/scripts/aur-update.sh '${GITHUB_REF_NAME#v}' aur"

      # --nocheck because the release job has run the daemon's tests.
      - name: Build it
        if: env.AUR_SSH_KEY != ''
        working-directory: aur
        run: su builder -c 'makepkg --noconfirm --nocheck'

      - name: Push to the AUR
        if: env.AUR_SSH_KEY != ''
        working-directory: aur
        run: |
          git config --global --add safe.directory "$PWD"
          git config user.name FishfulThinking
          git config user.email 25772111+Maselkov@users.noreply.github.com
          git add PKGBUILD .SRCINFO poe-waytrade.install
          if git diff --cached --quiet; then
            echo "The AUR package is already at $GITHUB_REF_NAME"
            exit 0
          fi
          git commit -m "Update to ${GITHUB_REF_NAME#v}"
          git push origin master
