name: Release

# Push a tag matching the PKGBUILD's pkgver, e.g.  git tag v0.12.0 && git push origin v0.12.0
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: .github/scripts/arch-setup.sh

      - name: Tag matches the package version
        run: |
          pkgver=$(sed -n 's/^pkgver=//p' packaging/arch/PKGBUILD)
          if [ "v$pkgver" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match pkgver $pkgver in packaging/arch/PKGBUILD" >&2
            exit 1
          fi
          echo "VERSION=$pkgver" >> "$GITHUB_ENV"

      - name: Test
        working-directory: daemon
        run: cargo test --locked

      - name: Arch package
        working-directory: packaging/arch
        run: su builder -c 'makepkg --noconfirm'
      - name: Layer exports only Vulkan entry points
        run: .github/scripts/check-exports.sh packaging/arch/pkg/poe-waytrade/usr/lib/libVkLayer_poe_waytrade.so

      # The same files as the Arch package, as a tarball laid out from / for
      # other distros (built on Arch: needs a recent glibc).
      - name: Tarball
        run: |
          name=poe-waytrade-$VERSION-x86_64
          mkdir -p dist
          tar -C packaging/arch/pkg/poe-waytrade --exclude='.*' -czf "dist/$name.tar.gz" usr
          cp packaging/arch/*.pkg.tar.zst dist/
          cd dist && sha256sum * > SHA256SUMS

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          cat > notes.md <<NOTES
          ## Install

          **Arch Linux:** \`sudo pacman -U poe-waytrade-$VERSION-*.pkg.tar.zst\`

          **Other distros (recent glibc):** \`sudo tar -C / -xzf poe-waytrade-$VERSION-x86_64.tar.gz\`

          Set Path of Exile's Steam launch options to \`waytrade %command%\`. It turns the overlay on and runs the
          price daemon while you play (or uses the systemd socket's, if you enable it:
          \`systemctl --user enable --now poe-waytrade-daemon.socket\`).
          Trade searches need Chromium (or Google Chrome).
          NOTES
          gh release create "$GITHUB_REF_NAME" dist/* --title "Waytrade $VERSION" --notes-file notes.md --generate-notes
