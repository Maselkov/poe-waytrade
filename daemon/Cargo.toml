[package]
name = "poe-waytrade-daemon"
version = "0.22.0"
edition = "2024"
description = "Price lookups for the poe-waytrade Vulkan layer"
license = "GPL-3.0-or-later"

[dependencies]
libc = "0.2"
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
